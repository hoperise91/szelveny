[project]
name = "szelveny"
version = "0.0.1"
description = "Szelvény data pipeline: Hungarian road data (NAP, OSM) -> linear-referenced network"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "networkx>=3.3",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "duckdb>=1.1",
  "requests>=2.32",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["szelveny"]

[tool.ruff]
line-length = 100
target-version = "py312"
